<!DOCTYPE html>
<!--
    repo 根目錄的著陸頁。

    沒有 index.html 的話，https://wylopci.github.io/retrotaiwan-site/ 會是 404。
    政策本身在 /privacy.html 一樣能開，但根目錄 404 看起來像網站掛了——
    如果哪天有人（或審核員）把網址截短，第一印象會很差。

    刻意不做自動轉址：轉址會讓「這個網址是什麼」變得不明確，
    也會讓瀏覽器的上一頁行為變得奇怪。一個連結就夠了。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老派散策 Retro Taiwan</title>
<style>
  :root { --ink:#2b2622; --muted:#6b625a; --paper:#fbf8f3; --accent:#8a5a3b; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#ece5dc; --muted:#a49a8f; --paper:#1b1815; --accent:#c9976a; }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif;
    text-align: center;
    padding: 2rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: .04em; }
  p.sub { color: var(--muted); margin: 0 0 2rem; font-size: .95rem; }
  a { color: var(--accent); }
  nav a { display: block; margin: .5rem 0; }
</style>
</head>
<body>
<main>
  <h1>老派散策</h1>
  <p class="sub">Retro Taiwan — 走進台灣的老建築</p>
  <nav>
    <a href="privacy.html">隱私權政策 · Privacy Policy</a>
  </nav>
</main>
</body>
</html>
